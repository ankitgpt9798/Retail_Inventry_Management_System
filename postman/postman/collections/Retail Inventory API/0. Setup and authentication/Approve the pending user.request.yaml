$kind: http-request
description: "**ADMIN only.** Approving = setting the status to ACTIVE (the role can be changed here too)."
url: "{{baseUrl}}/users/{{pendingId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "ACTIVE",
      "role": "STAFF"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("answer has the standard shape", () => { pm.expect(body.success).to.equal(true); pm.expect(body.message).to.be.a("string"); });
      pm.test("now active", () => { pm.expect(body.data.user.status).to.equal("ACTIVE"); });
    language: text/javascript
order: 11000
