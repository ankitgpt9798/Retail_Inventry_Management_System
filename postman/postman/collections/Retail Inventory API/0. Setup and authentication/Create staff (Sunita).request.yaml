$kind: http-request
description: "**ADMIN only.** Staff create and process customer orders."
url: "{{baseUrl}}/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Sunita Rao",
      "email": "{{staffEmail}}",
      "password": "{{staffPassword}}",
      "role": "STAFF"
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set("staffEmail", `staff-${pm.collectionVariables.get("runId")}@postman.test`);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("status is 201", () => pm.response.to.have.status(201));
      const body = pm.response.json();
      pm.test("answer has the standard shape", () => { pm.expect(body.success).to.equal(true); pm.expect(body.message).to.be.a("string"); });
      { const value = body.data.user._id; if (value !== undefined && value !== null) pm.collectionVariables.set("staffId", String(value)); }
    language: text/javascript
order: 6000
