$kind: http-request
name: Who am I?
description: Any logged-in role. Returns the current user (never the password).
url: "{{baseUrl}}/auth/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("answer has the standard shape", () => { pm.expect(body.success).to.equal(true); pm.expect(body.message).to.be.a("string"); });
      pm.test("it is the admin", () => { pm.expect(body.data.user.role).to.equal("ADMIN"); });
    language: text/javascript
order: 3000
