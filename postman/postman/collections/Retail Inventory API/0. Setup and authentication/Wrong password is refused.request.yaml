$kind: http-request
description: The same message for a wrong password and an unknown email, so nobody can find out which emails have accounts. Five wrong passwords lock an account for 15 minutes (429 TOO_MANY_ATTEMPTS, with a Retry-After header); this collection stops at one so it never locks anyone.
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{staffEmail}}",
      "password": "definitely-wrong-1"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 401", () => pm.response.to.have.status(401));
      const body = pm.response.json();
      pm.test("error code is INVALID_CREDENTIALS", () => pm.expect(body.error).to.equal("INVALID_CREDENTIALS"));
      pm.test("error answer has the standard shape", () => { pm.expect(body.success).to.equal(false); pm.expect(body.message).to.be.a("string"); });
    language: text/javascript
order: 12000
