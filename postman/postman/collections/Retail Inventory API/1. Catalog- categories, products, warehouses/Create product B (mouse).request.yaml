$kind: http-request
url: "{{baseUrl}}/products"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Mouse {{runId}}",
      "sku": "mou-{{runId}}",
      "category": "{{categoryId}}",
      "costPrice": 150,
      "sellingPrice": 500,
      "taxRate": 0,
      "reorderLevel": 5
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 201", () => pm.response.to.have.status(201));
      const body = pm.response.json();
      pm.test("answer has the standard shape", () => { pm.expect(body.success).to.equal(true); pm.expect(body.message).to.be.a("string"); });
      { const value = body.data.product._id; if (value !== undefined && value !== null) pm.collectionVariables.set("productBId", String(value)); }
    language: text/javascript
order: 7000
