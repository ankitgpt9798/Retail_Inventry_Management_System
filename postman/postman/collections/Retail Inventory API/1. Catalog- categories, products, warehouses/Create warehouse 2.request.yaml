$kind: http-request
url: "{{baseUrl}}/warehouses"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Noida Hub {{runId}}",
      "code": "noi-{{runId}}",
      "city": "Noida",
      "capacity": 3000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 201", () => pm.response.to.have.status(201));
      const body = pm.response.json();
      pm.test("answer has the standard shape", () => { pm.expect(body.success).to.equal(true); pm.expect(body.message).to.be.a("string"); });
      { const value = body.data.warehouse._id; if (value !== undefined && value !== null) pm.collectionVariables.set("warehouse2Id", String(value)); }
    language: text/javascript
order: 14000
