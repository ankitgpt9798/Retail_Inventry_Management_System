$kind: http-request
url: "{{baseUrl}}/warehouses/{{warehouseId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("answer has the standard shape", () => { pm.expect(body.success).to.equal(true); pm.expect(body.message).to.be.a("string"); });
      pm.test("stock summary present", () => { pm.expect(body.data.stockSummary).to.have.property('totalQuantity'); });
    language: text/javascript
order: 16000
