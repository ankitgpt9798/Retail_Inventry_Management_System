$kind: http-request
url: "{{baseUrl}}/warehouses?search={{runId}}&status=ACTIVE"
method: GET
queryParams:
  search: "{{runId}}"
  status: ACTIVE
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("answer has the standard shape", () => { pm.expect(body.success).to.equal(true); pm.expect(body.message).to.be.a("string"); });
      pm.test("both warehouses", () => { pm.expect(body.data.warehouses).to.have.length(2); });
    language: text/javascript
order: 15000
