$kind: http-request
url: "{{baseUrl}}/products/{{productId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "sellingPrice": 1100
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("answer has the standard shape", () => { pm.expect(body.success).to.equal(true); pm.expect(body.message).to.be.a("string"); });
      pm.test("new price", () => { pm.expect(body.data.product.sellingPrice).to.equal(1100); });
    language: text/javascript
order: 12000
