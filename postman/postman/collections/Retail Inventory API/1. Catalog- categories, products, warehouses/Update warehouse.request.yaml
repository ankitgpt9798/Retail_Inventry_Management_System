$kind: http-request
url: "{{baseUrl}}/warehouses/{{warehouse2Id}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "capacity": 3500
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("answer has the standard shape", () => { pm.expect(body.success).to.equal(true); pm.expect(body.message).to.be.a("string"); });
      pm.test("new capacity", () => { pm.expect(body.data.warehouse.capacity).to.equal(3500); });
    language: text/javascript
order: 17000
