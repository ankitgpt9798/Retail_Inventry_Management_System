$kind: http-request
description: "Filters: `warehouse`, `product`, `search`, `lowStock=true`, `page`, `limit`."
url: "{{baseUrl}}/inventory?warehouse={{warehouseId}}"
method: GET
queryParams:
  warehouse: "{{warehouseId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("answer has the standard shape", () => { pm.expect(body.success).to.equal(true); pm.expect(body.message).to.be.a("string"); });
      pm.test("both products", () => { pm.expect(body.data.inventories).to.have.length(2); });
    language: text/javascript
order: 9000
