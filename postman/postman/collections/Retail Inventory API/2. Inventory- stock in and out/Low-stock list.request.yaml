$kind: http-request
url: "{{baseUrl}}/inventory/low-stock?warehouse={{warehouseId}}"
method: GET
queryParams:
  warehouse: "{{warehouseId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("answer has the standard shape", () => { pm.expect(body.success).to.equal(true); pm.expect(body.message).to.be.a("string"); });
      pm.test("the mouse (40 available, level 45) is low", () => { pm.expect(body.data.inventories.map(i => i.product.sku)).to.include(pm.collectionVariables.get('productSku').replace('LAP-','MOU-')); });
    language: text/javascript
order: 10000
