$kind: http-request
description: Low stock = AVAILABLE quantity below the reorder level. Crossing it sends a LOW_STOCK notification to admins and managers.
url: "{{baseUrl}}/inventory/{{inventoryBId}}/reorder-level"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "reorderLevel": 45
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("answer has the standard shape", () => { pm.expect(body.success).to.equal(true); pm.expect(body.message).to.be.a("string"); });
      pm.test("saved", () => { pm.expect(body.data.inventory.reorderLevel).to.equal(45); });
    language: text/javascript
order: 8000
