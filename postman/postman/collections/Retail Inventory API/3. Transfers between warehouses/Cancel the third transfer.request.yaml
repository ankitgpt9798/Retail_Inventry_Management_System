$kind: http-request
url: "{{baseUrl}}/transfers/{{transfer3Id}}/cancel"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "reason": "Plans changed"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("answer has the standard shape", () => { pm.expect(body.success).to.equal(true); pm.expect(body.message).to.be.a("string"); });
      pm.test("CANCELLED", () => { pm.expect(body.data.transfer.status).to.equal('CANCELLED'); });
    language: text/javascript
order: 14000
