$kind: http-request
url: "{{baseUrl}}/transfers/{{transfer2Id}}/reject"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "reason": "Destination is overstocked"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("answer has the standard shape", () => { pm.expect(body.success).to.equal(true); pm.expect(body.message).to.be.a("string"); });
      pm.test("REJECTED with the reason", () => { pm.expect(body.data.transfer).to.include({ status: 'REJECTED', rejectionReason: 'Destination is overstocked' }); });
    language: text/javascript
order: 13000
