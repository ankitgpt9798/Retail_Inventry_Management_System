$kind: http-request
url: "{{baseUrl}}/transfers"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "product": "{{productBId}}",
      "fromWarehouse": "{{warehouseId}}",
      "toWarehouse": "{{warehouse2Id}}",
      "quantity": 2
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 201", () => pm.response.to.have.status(201));
      const body = pm.response.json();
      pm.test("answer has the standard shape", () => { pm.expect(body.success).to.equal(true); pm.expect(body.message).to.be.a("string"); });
      { const value = body.data.transfer._id; if (value !== undefined && value !== null) pm.collectionVariables.set("transfer3Id", String(value)); }
    language: text/javascript
order: 4000
