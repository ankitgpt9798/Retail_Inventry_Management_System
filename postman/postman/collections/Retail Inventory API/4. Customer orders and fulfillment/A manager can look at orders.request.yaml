$kind: http-request
url: "{{baseUrl}}/orders/{{orderId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("answer has the standard shape", () => { pm.expect(body.success).to.equal(true); pm.expect(body.message).to.be.a("string"); });
      pm.test("visible", () => { pm.expect(body.data.order._id).to.equal(pm.collectionVariables.get('orderId')); });
    language: text/javascript
order: 21000
