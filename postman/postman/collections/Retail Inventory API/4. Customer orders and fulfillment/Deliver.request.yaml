$kind: http-request
url: "{{baseUrl}}/orders/{{orderId}}/status"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "DELIVERED"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("answer has the standard shape", () => { pm.expect(body.success).to.equal(true); pm.expect(body.message).to.be.a("string"); });
      pm.test("DELIVERED, with the full history", () => { pm.expect(body.data.order.status).to.equal('DELIVERED'); pm.expect(body.data.order.statusHistory.length).to.be.at.least(5); });
    language: text/javascript
order: 14000
