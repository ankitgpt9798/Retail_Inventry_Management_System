$kind: http-request
url: "{{baseUrl}}/orders/{{orderId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("answer has the standard shape", () => { pm.expect(body.success).to.equal(true); pm.expect(body.message).to.be.a("string"); });
      pm.test("two lines with snapshot prices", () => { pm.expect(body.data.items).to.have.length(2); pm.expect(body.data.items[0].unitPrice).to.equal(1100); });
    language: text/javascript
order: 18000
