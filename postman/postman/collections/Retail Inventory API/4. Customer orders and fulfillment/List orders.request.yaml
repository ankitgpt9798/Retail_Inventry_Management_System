$kind: http-request
description: "Filters: `status`, `warehouse`, `search` (number, customer, phone), `from`, `to`, `page`, `limit`."
url: "{{baseUrl}}/orders?warehouse={{warehouseId}}"
method: GET
queryParams:
  warehouse: "{{warehouseId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("answer has the standard shape", () => { pm.expect(body.success).to.equal(true); pm.expect(body.message).to.be.a("string"); });
      pm.test("both orders", () => { pm.expect(body.data.orders).to.have.length(2); });
    language: text/javascript
order: 17000
