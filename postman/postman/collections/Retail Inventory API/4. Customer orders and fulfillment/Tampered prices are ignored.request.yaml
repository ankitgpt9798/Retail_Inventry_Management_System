$kind: http-request
url: "{{baseUrl}}/orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "customer": {
        "name": "Cheeky Customer"
      },
      "warehouse": "{{warehouseId}}",
      "items": [
        {
          "product": "{{productBId}}",
          "quantity": 1,
          "unitPrice": 1,
          "lineTotal": 1
        }
      ],
      "totalAmount": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 201", () => pm.response.to.have.status(201));
      const body = pm.response.json();
      pm.test("answer has the standard shape", () => { pm.expect(body.success).to.equal(true); pm.expect(body.message).to.be.a("string"); });
      pm.test("the mouse costs 500, not 1", () => { pm.expect(body.data.order.totalAmount).to.equal(500); });
      { const value = body.data.order._id; if (value !== undefined && value !== null) pm.collectionVariables.set("order2Id", String(value)); }
    language: text/javascript
order: 3000
