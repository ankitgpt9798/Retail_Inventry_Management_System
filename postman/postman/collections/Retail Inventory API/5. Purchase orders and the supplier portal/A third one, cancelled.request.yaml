$kind: http-request
description: Any open order can be cancelled (a rejected one is already final, so this is refused).
url: "{{baseUrl}}/purchases/{{purchase2Id}}/cancel"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "reason": "no longer needed"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 409", () => pm.response.to.have.status(409));
      const body = pm.response.json();
      pm.test("error code is INVALID_PURCHASE_STATUS", () => pm.expect(body.error).to.equal("INVALID_PURCHASE_STATUS"));
      pm.test("error answer has the standard shape", () => { pm.expect(body.success).to.equal(false); pm.expect(body.message).to.be.a("string"); });
    language: text/javascript
order: 25000
