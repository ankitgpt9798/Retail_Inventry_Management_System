$kind: http-request
url: "{{baseUrl}}/purchases"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "supplier": "{{supplierId}}",
      "warehouse": "{{warehouse2Id}}",
      "items": [
        {
          "product": "{{productBId}}",
          "quantityOrdered": 5
        }
      ],
      "submit": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 201", () => pm.response.to.have.status(201));
      const body = pm.response.json();
      pm.test("answer has the standard shape", () => { pm.expect(body.success).to.equal(true); pm.expect(body.message).to.be.a("string"); });
      { const value = body.data.purchase._id; if (value !== undefined && value !== null) pm.collectionVariables.set("purchase2Id", String(value)); }
    language: text/javascript
order: 22000
