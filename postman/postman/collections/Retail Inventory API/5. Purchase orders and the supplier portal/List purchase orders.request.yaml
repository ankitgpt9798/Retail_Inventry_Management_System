$kind: http-request
description: "Filters: `status`, `supplier`, `warehouse`, `search` (PO number), `page`, `limit`."
url: "{{baseUrl}}/purchases?supplier={{supplierId}}"
method: GET
queryParams:
  supplier: "{{supplierId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("answer has the standard shape", () => { pm.expect(body.success).to.equal(true); pm.expect(body.message).to.be.a("string"); });
      pm.test("both orders", () => { pm.expect(body.data.purchases).to.have.length(2); });
    language: text/javascript
order: 26000
