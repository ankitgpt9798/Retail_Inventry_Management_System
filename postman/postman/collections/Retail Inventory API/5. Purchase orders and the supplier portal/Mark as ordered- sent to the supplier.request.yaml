$kind: http-request
name: "Mark as ordered: sent to the supplier"
url: "{{baseUrl}}/purchases/{{purchaseId}}/order"
method: PUT
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("answer has the standard shape", () => { pm.expect(body.success).to.equal(true); pm.expect(body.message).to.be.a("string"); });
      pm.test("ORDERED", () => { pm.expect(body.data.purchase.status).to.equal('ORDERED'); });
    language: text/javascript
order: 9000
