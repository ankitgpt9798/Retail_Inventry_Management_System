$kind: http-request
url: "{{baseUrl}}/purchases/{{purchaseId}}/receive"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "items": [
        {
          "product": "{{productId}}",
          "quantity": 8
        },
        {
          "product": "{{productBId}}",
          "quantity": 10
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("answer has the standard shape", () => { pm.expect(body.success).to.equal(true); pm.expect(body.message).to.be.a("string"); });
      pm.test("RECEIVED", () => { pm.expect(body.data.purchase.status).to.equal('RECEIVED'); });
    language: text/javascript
order: 20000
