$kind: http-request
name: "Supplier: cannot use the buyer's controls"
url: "{{baseUrl}}/purchases/{{purchaseId}}/approve"
method: PUT
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 403", () => pm.response.to.have.status(403));
      const body = pm.response.json();
      pm.test("error code is FORBIDDEN", () => pm.expect(body.error).to.equal("FORBIDDEN"));
      pm.test("error answer has the standard shape", () => { pm.expect(body.success).to.equal(false); pm.expect(body.message).to.be.a("string"); });
    language: text/javascript
order: 16000
