$kind: http-request
name: "Supplier: confirm the order"
description: "**SUPPLIER only.** Optional delivery date and note."
url: "{{baseUrl}}/purchases/{{purchaseId}}/confirm"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "expectedDeliveryDate": "2030-01-20",
      "deliveryNote": "Ships on Monday"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("answer has the standard shape", () => { pm.expect(body.success).to.equal(true); pm.expect(body.message).to.be.a("string"); });
      pm.test("confirmed", () => { pm.expect(body.data.purchase.supplierConfirmedAt).to.be.ok; });
    language: text/javascript
order: 13000
