$kind: http-request
name: "Supplier: confirming twice is refused"
url: "{{baseUrl}}/purchases/{{purchaseId}}/confirm"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 409", () => pm.response.to.have.status(409));
      const body = pm.response.json();
      pm.test("error code is ALREADY_CONFIRMED", () => pm.expect(body.error).to.equal("ALREADY_CONFIRMED"));
      pm.test("error answer has the standard shape", () => { pm.expect(body.success).to.equal(false); pm.expect(body.message).to.be.a("string"); });
    language: text/javascript
order: 14000
