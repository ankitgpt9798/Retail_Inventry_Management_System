$kind: http-request
url: "{{baseUrl}}/purchases/{{purchaseId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("answer has the standard shape", () => { pm.expect(body.success).to.equal(true); pm.expect(body.message).to.be.a("string"); });
      pm.test("the buyer sees it", () => { pm.expect(body.data.purchase.poNumber).to.match(/^PO-\d{6}$/); });
    language: text/javascript
order: 3000
