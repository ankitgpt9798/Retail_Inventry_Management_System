$kind: http-request
url: "{{baseUrl}}/notifications/read-all"
method: PUT
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("answer has the standard shape", () => { pm.expect(body.success).to.equal(true); pm.expect(body.message).to.be.a("string"); });
      pm.test("count of updated notifications", () => { pm.expect(body.data.updatedCount).to.be.a('number'); });
    language: text/javascript
order: 5000
