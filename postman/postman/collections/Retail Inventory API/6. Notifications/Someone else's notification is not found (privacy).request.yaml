$kind: http-request
url: "{{baseUrl}}/notifications/{{notificationId}}/read"
method: PUT
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 404", () => pm.response.to.have.status(404));
      const body = pm.response.json();
      pm.test("error code is NOTIFICATION_NOT_FOUND", () => pm.expect(body.error).to.equal("NOTIFICATION_NOT_FOUND"));
      pm.test("error answer has the standard shape", () => { pm.expect(body.success).to.equal(false); pm.expect(body.message).to.be.a("string"); });
    language: text/javascript
order: 8000
