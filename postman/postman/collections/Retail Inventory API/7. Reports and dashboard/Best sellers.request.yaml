$kind: http-request
description: Only goods that actually shipped count. `sortBy` = `units` or `revenue`; `limit` up to 100.
url: "{{baseUrl}}/reports/product-performance?warehouse={{warehouseId}}&sortBy=revenue&limit=5"
method: GET
queryParams:
  warehouse: "{{warehouseId}}"
  sortBy: revenue
  limit: "5"
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("answer has the standard shape", () => { pm.expect(body.success).to.equal(true); pm.expect(body.message).to.be.a("string"); });
      pm.test("ranked by revenue", () => { pm.expect(body.data.rows[0]).to.include.keys('sku','unitsSold','revenue'); });
    language: text/javascript
order: 10000
