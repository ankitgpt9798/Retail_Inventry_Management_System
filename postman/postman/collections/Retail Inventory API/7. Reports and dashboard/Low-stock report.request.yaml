$kind: http-request
url: "{{baseUrl}}/reports/low-stock?warehouse={{warehouseId}}"
method: GET
queryParams:
  warehouse: "{{warehouseId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("answer has the standard shape", () => { pm.expect(body.success).to.equal(true); pm.expect(body.message).to.be.a("string"); });
      pm.test("shortage and quantity on order", () => { pm.expect(body.data.summary).to.include.keys('itemCount','totalShortage'); });
    language: text/javascript
order: 9000
