$kind: http-request
description: "Filters: `from`, `to`, `warehouse`."
url: "{{baseUrl}}/reports/orders?warehouse={{warehouseId}}"
method: GET
queryParams:
  warehouse: "{{warehouseId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("answer has the standard shape", () => { pm.expect(body.success).to.equal(true); pm.expect(body.message).to.be.a("string"); });
      pm.test("revenue counts the delivered order", () => { pm.expect(body.data.summary.revenue).to.be.at.least(4200); pm.expect(body.data.byStatus).to.be.an('array'); });
    language: text/javascript
order: 6000
