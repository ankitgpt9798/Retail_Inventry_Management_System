$kind: http-request
description: "Filters: `from`, `to`, `warehouse`, `product`."
url: "{{baseUrl}}/reports/stock-movement?warehouse={{warehouseId}}"
method: GET
queryParams:
  warehouse: "{{warehouseId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("answer has the standard shape", () => { pm.expect(body.success).to.equal(true); pm.expect(body.message).to.be.a("string"); });
      pm.test("every movement type is present", () => { pm.expect(body.data.totals).to.have.keys('STOCK_IN','STOCK_OUT','TRANSFER_IN','TRANSFER_OUT','ADJUSTMENT'); });
    language: text/javascript
order: 5000
