$kind: http-request
url: "{{baseUrl}}/reports/warehouses"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("answer has the standard shape", () => { pm.expect(body.success).to.equal(true); pm.expect(body.message).to.be.a("string"); });
      pm.test("capacity used per warehouse", () => { pm.expect(body.data.rows[0]).to.include.keys('capacity','totalQuantity','utilizationPercent','stockValue'); });
    language: text/javascript
order: 4000
