$kind: http-request
description: The password change also cleared the login cookie, so there is nothing to send. (A copy of the old token, e.g. on another device, is refused with 401 SESSION_REVOKED.)
url: "{{baseUrl}}/auth/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 401", () => pm.response.to.have.status(401));
      const body = pm.response.json();
      pm.test("error code is NOT_AUTHENTICATED", () => pm.expect(body.error).to.equal("NOT_AUTHENTICATED"));
      pm.test("error answer has the standard shape", () => { pm.expect(body.success).to.equal(false); pm.expect(body.message).to.be.a("string"); });
    language: text/javascript
order: 19000
