$kind: http-request
name: "Audit log: the actions and record types that exist"
url: "{{baseUrl}}/audit-logs/filters"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("answer has the standard shape", () => { pm.expect(body.success).to.equal(true); pm.expect(body.message).to.be.a("string"); });
      pm.test("lists", () => { pm.expect(body.data.actions).to.be.an('array').that.is.not.empty; });
    language: text/javascript
order: 12000
