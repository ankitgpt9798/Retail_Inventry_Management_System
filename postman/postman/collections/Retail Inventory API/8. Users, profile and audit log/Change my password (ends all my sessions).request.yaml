$kind: http-request
url: "{{baseUrl}}/users/profile/password"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "{{staffPassword}}",
      "newPassword": "Changed12345"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("answer has the standard shape", () => { pm.expect(body.success).to.equal(true); pm.expect(body.message).to.be.a("string"); });
      pm.test("accepted", () => { pm.expect(body.success).to.equal(true); });
      { const value = 'Changed12345'; if (value !== undefined && value !== null) pm.collectionVariables.set("staffPassword", String(value)); }
    language: text/javascript
order: 18000
