$kind: http-request
url: "{{baseUrl}}/users/{{pendingId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("answer has the standard shape", () => { pm.expect(body.success).to.equal(true); pm.expect(body.message).to.be.a("string"); });
      pm.test("INACTIVE, not deleted", () => { pm.expect(body.data.user.status).to.equal('INACTIVE'); });
    language: text/javascript
order: 8000
