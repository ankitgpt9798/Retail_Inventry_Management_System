$kind: http-request
description: Ends every session of that person, and lifts a login lock.
url: "{{baseUrl}}/users/{{pendingId}}/password"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "newPassword": "Reset12345"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test("answer has the standard shape", () => { pm.expect(body.success).to.equal(true); pm.expect(body.message).to.be.a("string"); });
    language: text/javascript
order: 10000
