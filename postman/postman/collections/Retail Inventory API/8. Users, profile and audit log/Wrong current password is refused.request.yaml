$kind: http-request
url: "{{baseUrl}}/users/profile/password"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "not-my-password",
      "newPassword": "Another12345"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 400", () => pm.response.to.have.status(400));
      const body = pm.response.json();
      pm.test("error code is INVALID_CURRENT_PASSWORD", () => pm.expect(body.error).to.equal("INVALID_CURRENT_PASSWORD"));
      pm.test("error answer has the standard shape", () => { pm.expect(body.success).to.equal(false); pm.expect(body.message).to.be.a("string"); });
    language: text/javascript
order: 17000
