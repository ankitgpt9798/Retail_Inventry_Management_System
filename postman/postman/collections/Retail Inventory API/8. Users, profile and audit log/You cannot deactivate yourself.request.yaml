$kind: http-request
url: "{{baseUrl}}/users/{{adminId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 400", () => pm.response.to.have.status(400));
      const body = pm.response.json();
      pm.test("error code is CANNOT_DEACTIVATE_SELF", () => pm.expect(body.error).to.equal("CANNOT_DEACTIVATE_SELF"));
      pm.test("error answer has the standard shape", () => { pm.expect(body.success).to.equal(false); pm.expect(body.message).to.be.a("string"); });
    language: text/javascript
order: 7000
