$kind: http-request
name: "Injection attempt on login: refused"
description: Query operators instead of strings must never be accepted.
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": {
        "$ne": null
      },
      "password": {
        "$ne": null
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 422", () => pm.response.to.have.status(422));
      const body = pm.response.json();
      pm.test("error code is VALIDATION_ERROR", () => pm.expect(body.error).to.equal("VALIDATION_ERROR"));
      pm.test("error answer has the standard shape", () => { pm.expect(body.success).to.equal(false); pm.expect(body.message).to.be.a("string"); });
    language: text/javascript
order: 7000
