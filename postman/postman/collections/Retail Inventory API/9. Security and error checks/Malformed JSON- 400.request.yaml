$kind: http-request
name: "Malformed JSON: 400"
description: The body is deliberately broken (a pre-request script replaces it with text that is not JSON).
url: "{{baseUrl}}/categories"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "placeholder"
    }
scripts:
  - type: beforeRequest
    code: pm.request.body.update("{ this is not json");
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("status is 400", () => pm.response.to.have.status(400));
      const body = pm.response.json();
      pm.test("error code is INVALID_JSON", () => pm.expect(body.error).to.equal("INVALID_JSON"));
      pm.test("error answer has the standard shape", () => { pm.expect(body.success).to.equal(false); pm.expect(body.message).to.be.a("string"); });
    language: text/javascript
order: 6000
